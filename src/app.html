<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" type="text/css" href="%sveltekit.assets%/spinner.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <script>
            // Capture the install prompt early; it can fire before the /install route mounts
            window.addEventListener('beforeinstallprompt', function (e) {
                // Only suppress the browser's install UI on the install page (hash routing)
                if (/^#\/install(?:[/?]|$)/.test(window.location.hash)) {
                    e.preventDefault();
                }
                window.deferredInstallPrompt = e;
            });
        </script>
        %sveltekit.head%
    </head>

    <body>
        <span class="spin" id="loading-spinner"></span>
        <div>%sveltekit.body%</div>
    </body>
</html>
